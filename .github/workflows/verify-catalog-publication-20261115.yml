name: Verify catalog publication
on:
  push:
    branches: [main]
    paths:
      - public/Catalogo_GM_Electronics_4x4_15Nov2026_Stock.pdf
      - scripts/verify-catalog-publication-20261115.py
      - .github/workflows/verify-catalog-publication-20261115.yml
permissions:
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.5
      - run: python scripts/verify-catalog-publication-20261115.py
