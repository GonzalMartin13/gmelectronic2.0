name: Verify featured products
on:
  push:
    branches: [refresh-featured-20261117, refresh-featured-static-20261118, main]
    paths:
      - 'src/live-promos.jsx'
      - 'src/live-promos.css'
      - 'src/featured-promos.mjs'
      - 'public/promos/**'
      - 'scripts/verify-featured-promos-20261117.mjs'
      - '.github/workflows/featured-promos-20261117.yml'
permissions:
  contents: write
concurrency:
  group: featured-promos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npm run build
      - name: Verify preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gm-featured-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/verify-featured-promos-20261117.mjs
      - name: Verify public storefront
        if: github.ref == 'refs/heads/main'
        env:
          FEATURED_SITE: https://gmelectronic2-0.vercel.app
        run: node scripts/verify-featured-promos-20261117.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: featured-products-qa
          path: qa/featured-promos-20261118/
